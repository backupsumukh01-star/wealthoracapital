paths:
  /:
    get:
      tags:
        - Health
      summary: Service tip
      operationId: getRoot
      description: null
      security: []
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - meta
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      service:
                        type: string
                      health:
                        type: string
                      version:
                        type: string
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
        400:
          $ref: "#/components/responses/BadRequest"
        404:
          $ref: "#/components/responses/NotFound"
        409:
          $ref: "#/components/responses/Conflict"
        422:
          $ref: "#/components/responses/UnprocessableEntity"
        429:
          $ref: "#/components/responses/TooManyRequests"
        500:
          $ref: "#/components/responses/InternalError"
  /api/health:
    get:
      tags:
        - Health
      summary: Health check
      operationId: getHealth
      description: null
      security: []
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - meta
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - ok
                          - degraded
                      database:
                        type: string
                        enum:
