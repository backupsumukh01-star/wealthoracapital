components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: mfx_at
      description: "Primary auth: HTTP-only JWT access cookie (`mfx_at`) set by POST /api/v1/auth/login and /refresh. Path `/`, SameSite=lax."
    refreshCookie:
      type: apiKey
      in: cookie
      name: mfx_rt
      description: "Refresh JWT cookie. Path restricted to `/api/v1/auth`, SameSite=strict. Used only by POST /api/v1/auth/refresh."
    csrfCookie:
      type: apiKey
      in: cookie
      name: mfx_csrf
      description: "Readable CSRF cookie set with login/refresh. Header `X-CSRF-Token` is accepted; server-side CSRF enforcement is planned."
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Documented for API clients and future gateway use. The current Express API authenticates via `mfx_at` cookie (Authorization header is allowed by CORS but not parsed yet)."
  parameters:
    Page:
      name: page
      in: query
      description: 1-based page index for offset pagination
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    Limit:
      name: limit
      in: query
      description: Page size (max 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
    Q:
      name: q
      in: query
      schema:
        type: string
      description: Full-text / filter search
      example: growzy
    From:
      name: from
      in: query
      schema:
        type: string
        format: date-time
      description: Inclusive start (ISO-8601)
    To:
      name: to
      in: query
      schema:
        type: string
        format: date-time
      description: Inclusive end (ISO-8601)
    Status:
      name: status
      in: query
      schema:
        type: string
      description: Status filter
    Cursor:
      name: cursor
      in: query
      description: "Opaque cursor for keyset pagination (`nextCursor` from prior response)"
