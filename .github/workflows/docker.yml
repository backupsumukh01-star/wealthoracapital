name: Docker

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'docker-compose*.yml'
      - 'infra/**'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/Dockerfile*'
      - 'apps/web/Dockerfile'
      - 'docker-compose*.yml'
  workflow_dispatch:

jobs:
  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            file: apps/api/Dockerfile
          - name: worker
            file: apps/api/Dockerfile.worker
          - name: web
            file: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          tags: growzy/${{ matrix.name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
