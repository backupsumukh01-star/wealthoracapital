name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prod=false
      - run: pnpm --filter @meridian/api exec prisma generate
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian
          POSTGRES_DB: meridian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meridian -d meridian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://meridian:meridian@localhost:5432/meridian?schema=public
      JWT_ACCESS_SECRET: ci-test-access-secret-32chars-min!!
      JWT_REFRESH_SECRET: ci-test-refresh-secret-32chars-min!
      NODE_ENV: test
      CACHE_DRIVER: memory
      JOB_DRIVER: memory
      RATE_LIMIT_STORE: memory
      EMAIL_TRANSPORT: console
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prod=false
      - run: pnpm --filter @meridian/api exec prisma generate
      - run: pnpm --filter @meridian/api exec prisma migrate deploy
      - run: pnpm --filter @meridian/api test
      - run: pnpm --filter @meridian/shared test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prod=false
      - run: pnpm --filter @meridian/api exec prisma generate
      - run: pnpm --filter @meridian/api build
      - run: pnpm --filter @meridian/web build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_API_URL: https://api.example.com/api/v1
          NEXT_PUBLIC_SITE_URL: https://app.example.com
          NEXT_PUBLIC_PLATFORM_NAME: Growzy
          NEXT_PUBLIC_SUPPORT_EMAIL: support@example.com
          NEXT_PUBLIC_ENABLE_REFERRALS: 'false'
